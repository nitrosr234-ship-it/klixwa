<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Private WhatsApp</title><style>*{margin:0;padding:0;box-sizing:border-box}body,html{height:100%;background:#0b141a;font-family:Helvetica,Arial,sans-serif;overflow:hidden}.wa{height:100vh;display:flex;flex-direction:column;background:#0b141a}.header{background:#075e54;color:#fff;padding:10px;position:fixed;top:0;left:0;right:0;z-index:10;text-align:center;height:60px;line-height:40px;font-size:19px;font-weight:600}.chat{flex:1;padding:75px 10px 90px;overflow-y:auto}.bubble{background:#fff;color:#000;padding:15px 20px;border-radius:10px;max-width:85%;margin:15px 0;display:inline-block;position:relative;opacity:0;transform:translateY(30px);box-shadow:0 2px 5px rgba(0,0,0,0.4)}.bubble.show{opacity:1;transform:translateY(0);transition:all .7s}.bubble:after{content:'';position:absolute;top:18px;left:-12px;border:12px solid transparent;border-right-color:#fff}.number{font-size:23px;font-weight:bold;color:#00a884}.btn{display:block;margin:30px auto 0;padding:22px;background:#00a884;color:#fff;font-size:21px;font-weight:bold;text-align:center;border-radius:50px;text-decoration:none;width:90%;box-shadow:0 6px 20px rgba(0,168,132,0.5)}.countdown{color:#fff;text-align:center;margin:20px;font-size:19px;font-weight:bold}.footer{position:fixed;bottom:0;left:0;right:0;background:#202c33;color:#8696a0;text-align:center;padding:10px;font-size:13px}</style></head><body><div class="wa"><div class="header">Private WhatsApp</div><div class="chat"><div class="bubble show" style="animation-delay:.8s">You have 1 new private message from USA<br><div class="number" id="nomor">+1 (XXX) XXX-XXXX</div></div><div class="bubble show" style="animation-delay:2.5s"><strong>Click Here To View Message</strong><div class="countdown">Message will disappear in <span id="timer">10</span> seconds!</div><a href="http://www.hotlinkx.duckdns.org" class="btn" id="openBtn">TAP TO VIEW NOW!</a></div><div class="bubble show" style="animation-delay:4.5s">Hurry up! This is super private…</div></div><div class="footer">WhatsApp • End-to-end encrypted</div></div><audio id="notif" preload="auto"><source src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-remove-2578.mp3" type="audio/mpeg"></audio><script>let p=window.location.pathname.split('-').pop()||'4965654213';if(p.length>10)p=p.slice(-10);document.getElementById('nomor').textContent='+1 ('+p.substr(0,3)+') '+p.substr(3,3)+'-'+p.substr(6);let t=10;setInterval(()=>{if(t>0){t--;document.getElementById('timer').textContent=t}else{clearInterval(this);document.getElementById('openBtn').innerHTML='MESSAGE EXPIRED!';document.getElementById('openBtn').style.background='#e74c3c';document.getElementById('openBtn').removeAttribute('href')}},1000);document.body.addEventListener('touchstart',()=>document.getElementById('notif').play(),{once:true});</script></body></html>
